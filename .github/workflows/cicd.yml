name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-ts:
    name: TypeScript build & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@factioner/ts
      - run: npm run test:ts
      - name: Regression — golden scenario suite
        run: npm run test:ts

  build-test-rust:
    name: Rust build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - name: Build
        working-directory: packages/rust
        run: cargo build --locked --all-targets || cargo build --all-targets
      - name: Unit / integration tests
        working-directory: packages/rust
        run: cargo test --all-targets
      - name: Regression — release mode tests
        working-directory: packages/rust
        run: cargo test --release --all-targets

  build-test-python:
    name: Python unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: [build-test-ts, build-test-rust, build-test-python]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        working-directory: packages/rust
        run: |
          cargo install cargo-audit --locked || cargo install cargo-audit
          cargo audit || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        working-directory: packages/python
        run: |
          python -m pip install -U pip pip-audit
          pip install -e .
          pip-audit || true

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
