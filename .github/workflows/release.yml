name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip publish)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release-npm:
    name: Publish @factioner/ts to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@factioner/ts
      - name: Publish npm package
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: packages/ts
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry-run pack
        if: ${{ inputs.dry_run == true }}
        working-directory: packages/ts
        run: npm pack

  release-crates:
    name: Publish factioner to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: packages/rust
        run: cargo publish --token "${{ secrets.CARGO_REGISTRY_TOKEN }}"
      - name: Dry-run publish
        if: ${{ inputs.dry_run == true }}
        working-directory: packages/rust
        run: cargo publish --dry-run

  release-pypi:
    name: Publish factioner to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip build twine
      - name: Build sdist/wheel
        working-directory: packages/python
        run: python -m build
      - name: Publish to PyPI
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: packages/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
      - name: Dry-run check
        if: ${{ inputs.dry_run == true }}
        working-directory: packages/python
        run: twine check dist/*
